name: Python baseline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python compilation
        run: python -m compileall -q app.py suite budget emergency_fund housing_affordability net_worth rent_vs_buy assumptions
      - name: Baseline financial unit tests
        run: python -m unittest discover -s tests -v
